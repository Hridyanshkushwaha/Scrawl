# Render Blueprint: one web service serves the API, the WebSocket server and the built React client.
# Render supports WebSockets out of the box, so no extra configuration is needed.
services:
  - type: web
    name: scrawl
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
